# ------------------------------------------------------------------------------------
#  [VIETNAMESE - THÔNG TIN PLUGIN]
#  Phiên bản: 2.0.0 (Reborn)
#  Đây là plugin đầu tiên của _MintBae_ lấy cảm hứng từ Jacob Contest và 
#  tham khảo logic của MiningContest của VoChiDanh. 
#  Plugin tạo ra với mục đích mang lại niềm vui khi thu hoạch nông sản.
#  Plugin này có ngôn ngữ gốc là Tiếng Việt, cảm ơn vì đã sử dụng nó!
#
# ------------------------------------------------------------------------------------
#  [ENGLISH - PLUGIN INFORMATION]
#  Version: 2.0.0 (Reborn)
#  This is the first plugin by _MintBae_, inspired by Jacob Contest and 
#  referencing logic from MiningContest by VoChiDanh. 
#  Created with the aim of bringing joy to crop harvesting.
#  This plugin's native language is Vietnamese, thank you for using it!
# ====================================================================================

# ──────────────────────────────────────────────────────────────────
# 1. CUỘC THI (CONTEST CORE)
# ──────────────────────────────────────────────────────────────────
contest:
  enabled: true
  interval: "3h"            # Chu kỳ tự động mở cuộc thi (vd: 30s, 15m, 3h)
  duration: "15m"           # Thời lượng 1 cuộc thi
  min-participation-points: 200   # Điểm tối thiểu để được tính là "tham gia"

  crop-selection:
    count: 3                # Số loại nông sản được chọn ngẫu nhiên mỗi cuộc thi
    chance_crop:             # Tỉ lệ (trọng số) được chọn của từng loại nông sản
      WHEAT: 30
      CARROT: 25
      POTATO: 25
      PUMPKIN: 15
      MELON: 15
      SUGAR_CANE: 10
      CACTUS: 8
      NETHER_WART: 5
      BEETROOT: 20

# Điểm nhận được khi thu hoạch mỗi đơn vị nông sản
crop_point:
  WHEAT: 10
  CARROT: 8
  POTATO: 8
  PUMPKIN: 15
  MELON: 15
  SUGAR_CANE: 5
  CACTUS: 5
  NETHER_WART: 12
  BEETROOT: 9

# Tên hiển thị tiếng Việt cho từng loại nông sản
crop_placeholder:
  WHEAT: "Lúa Mì"
  CARROT: "Cà Rốt"
  POTATO: "Khoai Tây"
  PUMPKIN: "Bí Ngô"
  MELON: "Dưa Hấu"
  SUGAR_CANE: "Mía"
  CACTUS: "Xương Rồng"
  NETHER_WART: "Mụn Nether"
  BEETROOT: "Củ Cải Đường"

# ──────────────────────────────────────────────────────────────────
# 2. THÔNG BÁO KHI NGƯỜI CHƠI VÀO SERVER
# ──────────────────────────────────────────────────────────────────
auto-notify-on-join: true
auto-notify-message: "&6🌾 Cuộc thi nông sản đang diễn ra! Nông sản: &e{crops}"

# ──────────────────────────────────────────────────────────────────
# 3. HIỂN THỊ TRONG LÚC CUỘC THI DIỄN RA (BossBar / Title / ActionBar)
# ──────────────────────────────────────────────────────────────────
display_contest:
  bossbar:
    enabled: true
    text: "&a🌾 Cuộc Thi Nông Sản &7| &eNông sản: &f{crops} &7| &eCòn lại: &f{time}"
    color: "GREEN"          # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    style: "SEGMENTED_10"   # SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20

  title:
    start:
      enabled: true
      text: "&e&lFARM CONTEST"
      subtitle: "&fHãy thu hoạch nông sản được chọn để ghi điểm!"
      fadeIn: 20
      stay: 60
      fadeOut: 20

  actionbar:
    score:
      enabled: true
      text: "&6+{points} điểm &7({crop})"
    countdown:
      enabled: true
      text: "&aThời gian còn lại: &f{time}"

# ──────────────────────────────────────────────────────────────────
# 4. TIN NHẮN CHUNG (LỆNH /fc, THÔNG BÁO SỰ KIỆN...)
# ──────────────────────────────────────────────────────────────────
messages:
  # --- Quyền / lỗi chung ---
  no-permission: "&cBạn không có quyền sử dụng lệnh này!"
  player-only: "&cChỉ người chơi mới có thể sử dụng lệnh này!"
  invalid-player: "&cKhông tìm thấy người chơi này!"
  invalid-points: "&cSố điểm nhập vào không hợp lệ!"
  invalid-crop: "&cLoại nông sản (crop) không hợp lệ!"
  invalid-mutation: "&cĐột biến '{mutation}' không tồn tại trong mutation.yml!"

  # --- Vòng đời cuộc thi ---
  contest-running: "&cCuộc thi đang diễn ra rồi, không thể mở thêm!"
  contest-started: "&aĐã bắt đầu cuộc thi mới!"
  contest-stopped: "&aĐã dừng cuộc thi thành công!"
  no-contest: "&cHiện không có cuộc thi nào đang diễn ra!"
  no-contest-for-points: "&cKhông thể chỉnh điểm khi không có cuộc thi diễn ra!"

  start: "&a&l[FARM CONTEST] &fCuộc thi đã bắt đầu! Nông sản được chọn: &e{crops}"
  end: "&a&l[FARM CONTEST] &fCuộc thi đã kết thúc! Cảm ơn mọi người đã tham gia."

  participate-reward: "&aBạn đã hoàn thành với &e{points} điểm &avà nhận được phần thưởng tham gia!"
  not-enough: "&cBạn chưa đạt đủ &e{min-points} điểm &ctối thiểu để nhận thưởng tham gia."

  next-contest: "&6Cuộc thi tiếp theo sẽ mở sau: &e{time}"
  next-contest-disabled: "&cCuộc thi đã bị tắt trong cấu hình!"
  next-contest-running: "&aCuộc thi đang diễn ra ngay bây giờ!"

  # --- Điểm số ---
  points-reset: "&aĐã đặt lại toàn bộ điểm cuộc thi!"
  add-point: "&aBạn đã được cộng &e{points} điểm&a!"
  take-point: "&cBạn đã bị trừ &e{points} điểm&c!"
  set-point: "&6Điểm của bạn đã được đặt thành &e{points}&6!"
  admin-points-modified: "&aĐã {action} &e{points} điểm &acho người chơi &e{player}"

  # --- /fc info & /fc top ---
  info-self: "&6Điểm của bạn: &a{points}"
  info-other: "&6Điểm của &e{player}&6: &a{points}"
  top-header: "&6&l=== BẢNG XẾP HẠNG CUỘC THI ==="
  top-empty: "&7Chưa có người chơi nào tham gia."
  top-entry: "{rank} &f{player} &7- &a{points} điểm"
  rank-1: "&a🥇"
  rank-2: "&e🥈"
  rank-3: "&f🥉"
  rank-other: "&7#{rank}"

  # --- /fc profile ---
  profile-header: "&6&l══════ Hồ Sơ Nông Dân ══════"
  profile-name: "&eTên: &f{player}"
  profile-total-contests: "&eTổng cuộc thi tham gia: &a{value}"
  profile-top1: "&e🥇 Top 1: &a{value} lần"
  profile-top2: "&e🥈 Top 2: &a{value} lần"
  profile-top3: "&e🥉 Top 3: &a{value} lần"
  profile-harvests: "&eTổng nông sản đã thu hoạch: &a{value}"
  profile-footer: "&6&l════════════════════════════"

  # --- /fc shop ---
  shop-player-only: "&cChỉ người chơi mới có thể mở cửa hàng!"
  shop-vault-disabled: "&cTính năng Shop đột biến hiện đang bị vô hiệu hóa vì thiếu plugin Vault/Economy!"

  # --- /fc mutation give ---
  mutation-usage: "&cCú pháp: /fc mutation give <player> <crop> <mutation> [weight_min] [weight_max]"
  mutation-given: "&aĐã trao nông sản đột biến &e{mutation} &acho người chơi &e{player}"

  # --- /fc add|take|set ---
  points-usage: "&cCú pháp: /fc {action} <player> <points> [silent:true/false]"

  # --- /fc reload ---
  reload-success: "&aĐã reload cấu hình FarmContest & mutation thành công!"

# ──────────────────────────────────────────────────────────────────
# 5. TRỢ GIÚP (/fc help)
# ──────────────────────────────────────────────────────────────────
commands:
  help:
    - "&6&l=== FARMCONTEST - TRỢ GIÚP ==="
    - "&e/fc top &7- Xem bảng xếp hạng cuộc thi hiện tại"
    - "&e/fc info [player] &7- Xem điểm của bạn hoặc người khác"
    - "&e/fc profile [player] &7- Xem hồ sơ nông dân (lịch sử các cuộc thi)"
    - "&e/fc time &7- Xem thời gian mở cuộc thi tiếp theo"

help-admin:
  - "&c&l=== LỆNH QUẢN TRỊ ==="
  - "&e/fc start &7- Bắt đầu cuộc thi ngay lập tức"
  - "&e/fc stop &7- Dừng cuộc thi hiện tại"
  - "&e/fc reset &7- Đặt lại toàn bộ điểm"
  - "&e/fc reload &7- Tải lại cấu hình plugin"
  - "&e/fc add <player> <points> [silent:true/false] &7- Cộng điểm"
  - "&e/fc take <player> <points> [silent:true/false] &7- Trừ điểm"
  - "&e/fc set <player> <points> [silent:true/false] &7- Đặt điểm"

help-shop-line: "&e/fc shop &7- Mở cửa hàng thu mua nông sản đột biến"
help-mutation-line: "&e/fc mutation give <player> <crop> <mutation> [min_weight] [max_weight] &7- Trao nông sản đột biến"

# ──────────────────────────────────────────────────────────────────
# 6. LOG CONSOLE (khởi động / tắt plugin)
# ──────────────────────────────────────────────────────────────────
console-messages:
  starting: "FarmContest v2.0.0 đang khởi động..."
  vault-not-found: "Không tìm thấy plugin Vault! Tính năng /fc shop quy đổi tiền sẽ bị vô hiệu hóa."
  papi-registered: "Đã đăng ký mở rộng PlaceholderAPI thành công!"
  enabled: "FarmContest v2.0.0 đã được kích hoạt cùng hệ thống Đột Biến & Cửa Hàng!"
  disabled: "FarmContest v2.0.0 đã được tắt!"
  contest-started-log: "Cuộc thi đã bắt đầu với nông sản: {crops}{lucky}"
  contest-ended-log: "Cuộc thi đã kết thúc"
  db-connected: "Đã kết nối cơ sở dữ liệu SQLite: {file}"
  db-connect-error: "Không thể kết nối cơ sở dữ liệu SQLite: {error}"
  db-table-error: "Không thể tạo bảng dữ liệu: {error}"
  db-closed: "Đã đóng kết nối SQLite."
  db-close-error: "Lỗi khi đóng kết nối SQLite: {error}"
  db-harvest-error: "Lỗi CSDL khi tăng số lượt thu hoạch: {error}"
  db-result-error: "Lỗi CSDL khi ghi kết quả cuộc thi: {error}"
  db-profile-error: "Lỗi CSDL khi lấy hồ sơ nông dân: {error}"
  invalid-crop-warn: "Loại nông sản không hợp lệ: {key}"
  invalid-material-warn: "Vật phẩm không hợp lệ tại {path}: {entry}"
  invalid-duration-warn: "Định dạng thời gian không hợp lệ: {value}"
  data-save-error: "Không thể lưu file dữ liệu: {error}"
  data-create-error: "Không thể tạo file dữ liệu: {error}"
  data-invalid-uuid-warn: "UUID không hợp lệ trong file dữ liệu: {key}"

# ──────────────────────────────────────────────────────────────────
# 7. NÔNG SẢN ĐỘT BIẾN (MUTATION) — message & lore
#    (Cơ chế/tỉ lệ đột biến từng loại nằm ở mutation.yml,
#     toàn bộ text hiển thị cho người chơi đặt tại đây)
# ──────────────────────────────────────────────────────────────────
mutation-messages:
  default-mutation-name: "Đột Biến"
  default-mutation-display: "Đặc Biệt"

  broadcast-message: "&6✨ Bạn đã thu hoạch được &e{mutation} {crop}&6 với hệ số &ex{multiplier}&6!"

  item-format:
    name: "&6&l{mutation_name} {crop_display}"
    lore:
      - "&7Loại đột biến: &e{mutation_display}"
      - "&7Hệ số nhân: &ex{multiplier}"
      - "&7Trọng lượng: &e{weight} kg"
      - "&7Chủ sở hữu: &e{owner}"
      - ""
      - "&8Bán tại &7/fc shop"

  shop:
    menu-title: "&8[GUI] Thu Mua Nông Sản Đột Biến"
    success-message: "&aĐã quy đổi thành công và nhận được &e${money}&a!"
    invalid-item-returned: "&cCó item không hợp lệ đã được trả lại vào túi đồ của bạn."

# ──────────────────────────────────────────────────────────────────
# 8. VẬT PHẨM CÂY MAY MẮN (LUCKY CROP) & BUFF THỜI TIẾT
# ──────────────────────────────────────────────────────────────────
event_modifiers:
  lucky_crop:
    enabled: true
    chance: 0.05
    multiplier: 2.0
    drop_item: "GOLDEN_CARROT"
    item_name: "&6✨ Nông Sản Hoàng Kim"
    item_lore:
      - "&7Một nông sản đặc biệt may mắn"
      - "&7rơi ra trong lúc thu hoạch!"
    message: "&6✨ Nông Sản Hoàng Kim! &a+{points} điểm &7(x{multiplier}) &e- {crop}"
    announce_lucky_crop: true
    announce_message: "&6✨ Nông Sản May Mắn: &f{crop}&6! Thu hoạch để có cơ hội x{multiplier} điểm!"

  weather_buff:
    enabled: true
    rain_boost:
      multiplier: 1.2
      crops: ["WHEAT", "CARROT", "POTATO", "BEETROOT"]
      message: "&b☔ Buff Mưa! &a+{points} điểm &7(x{multiplier}) &e- {crop}"
    sun_boost:
      multiplier: 1.2
      crops: ["MELON", "PUMPKIN", "SUGAR_CANE", "CACTUS"]
      message: "&e☀ Buff Nắng! &a+{points} điểm &7(x{multiplier}) &e- {crop}"

# ──────────────────────────────────────────────────────────────────
# 9. PHẦN THƯỞNG (lệnh console thực thi khi cuộc thi kết thúc)
# ──────────────────────────────────────────────────────────────────
rewards:
  top1:
    - "eco give {player} 100000"
    - "give {player} diamond 5"
  top2:
    - "eco give {player} 50000"
    - "give {player} diamond 3"
  top3:
    - "eco give {player} 25000"
    - "give {player} diamond 1"
  participate:
    - "eco give {player} 5000"

# ──────────────────────────────────────────────────────────────────
# 10. LƯU DỮ LIỆU
# ──────────────────────────────────────────────────────────────────
data:
  save-interval: "5m"
  reset-points-after: true

# ──────────────────────────────────────────────────────────────────
# 11. GIÁ TRỊ MẶC ĐỊNH KHI PLACEHOLDERAPI CHƯA CÓ DỮ LIỆU
# ──────────────────────────────────────────────────────────────────
placeholder_fallback:
  time_left: "Không có"
  top_name: "Không có"
  top_points: "0"
  player_points: "0"
