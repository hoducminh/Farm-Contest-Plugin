#
#                         ✦ MUTATION SETTINGS ✦
# ------------------------------------------------------------------------------------
#  [VIETNAMESE - CẤU HÌNH ĐỘT BIẾN]
#  File này chứa thiết lập cơ chế đột biến nông sản:
#   • Tỉ lệ xuất hiện đột biến (Mutation Rate).
#   • Danh sách các loại nông sản cho phép đột biến.
#   • Điều kiện kích hoạt đột biến (Conditions: thời tiết, công cụ, thời gian,...).
#  
#  Tối ưu trải nghiệm thu hoạch và gia tăng tính bất ngờ cho người chơi!
#
# ------------------------------------------------------------------------------------
#  [ENGLISH - MUTATION SETTINGS]
#  This file contains configuration for crop mutation mechanics:
#   • Crop mutation chance & rates.
#   • List of crops eligible for mutation.
#   • Activation conditions (Conditions: weather, tools, time, etc.).
#  
#  Enhance harvesting gameplay and add exciting surprises for players
# ====================================================================================
settings:
  enabled: true
  global_chance: 0.03        # Tỉ lệ rớt đột biến mỗi lần thu hoạch hợp lệ
  weight:
    min: 10.0
    max: 200.0

shop:
  rows: 3
  base_price_per_kg: 50.0

# Định nghĩa các loại đột biến. "name" / "display" ở đây chỉ là dữ liệu
# thay thế cho {mutation_name} / {mutation_display} trong lore (config.yml),
# không phải câu message hoàn chỉnh.
mutations:
  giant:
    name: "Khổng Lồ"
    display: "Kích Thước Khổng Lồ"
    multiplier: 1.5
    available_crops: ["WHEAT", "CARROT", "POTATO", "PUMPKIN", "MELON", "BEETROOT"]
    condition: ""

  golden:
    name: "Hoàng Kim"
    display: "Ánh Kim Rực Rỡ"
    multiplier: 2.0
    available_crops: ["WHEAT", "CARROT", "POTATO", "PUMPKIN", "MELON", "SUGAR_CANE", "CACTUS", "BEETROOT"]
    condition: "midday"

  frozen:
    name: "Băng Giá"
    display: "Kết Tinh Băng Giá"
    multiplier: 1.8
    available_crops: ["WHEAT", "CARROT", "POTATO", "BEETROOT"]
    condition: "midnight"

  storm:
    name: "Bão Tố"
    display: "Sức Mạnh Bão Tố"
    multiplier: 2.5
    available_crops: ["SUGAR_CANE", "PUMPKIN", "MELON"]
    condition: "storm"
